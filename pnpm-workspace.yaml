  - "@biomejs/cli-android-arm64@2.6.9"
  - "@biomejs/cli-android-x64@2.6.9"
  - "@biomejs/cli-darwin-arm64@2.6.9"
  - "@biomejs/cli-darwin-x64@2.6.9"
  - "@biomejs/cli-linux-arm64-musl@2.6.9"
  - "@biomejs/cli-linux-arm64@2.6.9"
  - "@biomejs/cli-linux-x64-musl@2.6.9"
  - "@biomejs/cli-linux-x64@2.6.9"
  - "@biomejs/cli-win32-arm64@2.6.9"
  - "@biomejs/cli-win32-x64@2.6.9"
  - "@types/node@26.6.10"
  - "@vitest/mocker@5.1.2"
  - "@vitest/spy@5.1.2"
  - vitest@5.1.2
  - "@nestjs/common@12.6.2"
  - "@nestjs/core@12.6.2"
  - "@nestjs/platform-express@12.6.2"
  - "@nestjs/platform-node@12.6.1"
  - "@nestjs/testing@12.6.2"
